<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>macOS Style Preloader | Bansheebbyy</title>
    <style>
        :root {
            --matcha: #C2D8C4;
            --dusty: #222222;
            --apple-bezier: cubic-bezier(0.25, 1, 0.5, 1); /* Фирменная плавность Apple */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Системный шрифт Apple для идеального попадания в стиль */
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #111; /* Очень темный фон основного сайта */
            color: #fff;
            overflow: hidden; 
        }

        /* ================= PRELOADER (macOS Style) ================= */
        .macos-preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--dusty);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            /* Плавный переход для исчезновения (Fade + Scale) */
            transition: opacity 1s var(--apple-bezier), transform 1.2s var(--apple-bezier);
            transform-origin: center center;
        }

        .brand-name {
            font-size: 28px;
            font-weight: 500; /* Medium вес, как у заголовков Apple */
            letter-spacing: 0.5px;
            color: #f5f5f7; /* Цвет текста Apple (почти белый) */
            margin-bottom: 40px;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInApple 1s var(--apple-bezier) forwards 0.2s;
        }

        /* Ультра-тонкая полоса загрузки в стиле macOS Boot Screen */
        .progress-track {
            width: 220px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.1); /* Полупрозрачный трек */
            border-radius: 4px;
            overflow: hidden;
            opacity: 0;
            animation: fadeInApple 1s var(--apple-bezier) forwards 0.4s;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--matcha);
            border-radius: 4px;
            /* Плавное движение самой полоски */
            transition: width 0.3s ease-out;
            box-shadow: 0 0 10px rgba(194, 216, 196, 0.5); /* Легкое свечение матчи */
        }

        /* Мелкий системный текст статуса */
        .status-text {
            margin-top: 15px;
            font-size: 11px;
            color: #86868b; /* Apple-серый цвет */
            font-weight: 400;
            letter-spacing: 0.5px;
            opacity: 0;
            animation: fadeInApple 1s var(--apple-bezier) forwards 0.6s;
        }

        /* Классы для анимации ухода прелоадера */
        .macos-preloader.unlocked {
            opacity: 0;
            transform: scale(1.08); /* Слегка наезжает на нас и растворяется */
            pointer-events: none;
        }

        @keyframes fadeInApple {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ================= ОСНОВНОЙ КОНТЕНТ (для демонстрации) ================= */
        .main-content {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Начальное состояние основного сайта - чуть увеличен и размыт */
            transform: scale(0.92);
            filter: blur(10px);
            opacity: 0;
            transition: transform 1.2s var(--apple-bezier), filter 1s var(--apple-bezier), opacity 1s var(--apple-bezier);
            /* Абстрактный градиент для красоты фона */
            background: radial-gradient(circle at center, #1a241c 0%, #111 70%);
        }

        .main-content.visible {
            transform: scale(1); /* Возвращается в нормальный масштаб */
            filter: blur(0);
            opacity: 1;
        }

        .main-content h1 {
            font-size: 4rem;
            font-weight: 300;
            color: var(--matcha);
            letter-spacing: -2px;
        }

    </style>
</head>
<body>

    <!-- ЭКРАН ЗАГРУЗКИ В СТИЛЕ macOS -->
    <div class="macos-preloader" id="preloader">
        <div class="brand-name">Bansheebbyy</div>
        
        <div class="progress-track">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="status-text" id="statusText">Инициализация системы...</div>
    </div>

    <!-- ОСНОВНОЙ САЙТ -->
    <div class="main-content" id="mainContent">
        <h1>Welcome.</h1>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const progressBar = document.getElementById("progressBar");
            const statusText = document.getElementById("statusText");
            const preloader = document.getElementById("preloader");
            const mainContent = document.getElementById("mainContent");

            let progress = 0;

            // Массив статусов в стиле загрузки ОС
            const statuses = [
                "Инициализация системы...",
                "Загрузка модулей...",
                "Проверка безопасности...",
                "Рендеринг интерфейса...",
                "Готово."
            ];

            function updateStatus(percent) {
                if (percent < 20) statusText.innerText = statuses[0];
                else if (percent < 50) statusText.innerText = statuses[1];
                else if (percent < 80) statusText.innerText = statuses[2];
                else if (percent < 99) statusText.innerText = statuses[3];
                else statusText.innerText = statuses[4];
            }

            // Имитация неравномерной (реалистичной) загрузки
            const loading = setInterval(() => {
                // Случайный шаг от 1 до 12 для эффекта "зависаний" как при реальной загрузке
                const step = Math.floor(Math.random() * 12) + 1;
                progress += step;
                
                if (progress > 100) progress = 100;

                progressBar.style.width = progress + "%";
                updateStatus(progress);

                if (progress === 100) {
                    clearInterval(loading);
                    
                    // Задержка перед красивым переходом, чтобы глаз успел зафиксировать 100%
                    setTimeout(() => {
                        // Применяем классы для эффекта "разблокировки macOS"
                        preloader.classList.add("unlocked");
                        mainContent.classList.add("visible");
                        
                        // Удаляем прелоадер из DOM через 1.5 секунды (после завершения анимации)
                        setTimeout(() => {
                            preloader.remove();
                        }, 1500);
                    }, 500);
                }
            }, 180); // Интервал тика
        });
    </script>
</body>
</html>
