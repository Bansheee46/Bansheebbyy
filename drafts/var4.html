<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>macOS Calligraphy Preloader</title>
    <style>
        /* Base Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0d11;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            color: #ffffff;
        }

        /* 1. Preloader Container */
        .preloader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #08080c;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            overflow: hidden;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* This class will trigger the fade-out and slide-up transition */
        .preloader-container.fade-out {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }

        /* 2. macOS Ambient Mesh Background */
        .ambient-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            pointer-events: none;
            mix-blend-mode: screen;
            z-index: 1;
        }

        .glow-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #ff4565 0%, rgba(255, 69, 101, 0) 70%);
            top: -10%;
            left: 10%;
            animation: drift 20s infinite alternate ease-in-out;
        }

        .glow-2 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #3b82f6 0%, rgba(59, 130, 246, 0) 70%);
            bottom: -20%;
            right: 10%;
            animation: drift 25s infinite alternate-reverse ease-in-out;
        }

        .glow-3 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #8b5cf6 0%, rgba(139, 92, 246, 0) 70%);
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 15s infinite alternate ease-in-out;
        }

        /* 3. Subtle Film Grain Texture Overlay */
        .grain-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            opacity: 0.04;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* 4. central SVG calligraphic text wrapper */
        .svg-wrapper {
            position: relative;
            z-index: 3;
            width: 90%;
            max-width: 480px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .svg-wrapper svg {
            width: 100%;
            height: auto;
            overflow: visible;
        }

        /* The single calligraphic path */
        .handwritten-path {
            fill: none;
            stroke: url(#appleGradient); /* Applies the custom color gradient */
            stroke-width: 5.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: url(#subtle-glow); /* Adds realistic light emission blur */
            /* Stroke values will be calculated dynamically via Javascript for precision */
            stroke-dasharray: 1000; 
            stroke-dashoffset: 1000;
        }

        /* Background/Mesh Animations */
        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(5%, 10%) scale(1.1); }
            100% { transform: translate(-5%, -5%) scale(0.95); }
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.3; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.5; }
        }

        /* --- MOCK MAIN PAGE CONTENT (visible after loader fades out) --- */
        .main-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s,
                        transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s;
        }

        body:not(.loading) .main-content {
            opacity: 1;
            transform: scale(1);
        }

        .main-content h1 {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.022em;
            margin-bottom: 12px;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-content p {
            color: #8e8e93;
            font-size: 1.1rem;
            max-width: 500px;
            line-height: 1.5;
        }
    </style>
</head>
<body class="loading">

    <!-- PRELOADER OVERLAY -->
    <div class="preloader-container" id="preloader">
        <div class="ambient-glow glow-1"></div>
        <div class="ambient-glow glow-2"></div>
        <div class="ambient-glow glow-3"></div>
        <div class="grain-overlay"></div>
        
        <div class="svg-wrapper">
            <!-- Continuous single stroke "hello" vector calligraphy -->
            <svg viewBox="0 0 310 200" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Apple-styled premium gradient -->
                    <linearGradient id="appleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#ff4565" />
                        <stop offset="30%" stop-color="#ff9b26" />
                        <stop offset="65%" stop-color="#8b5cf6" />
                        <stop offset="100%" stop-color="#3b82f6" />
                    </linearGradient>

                    <!-- Soft Glow Filter -->
                    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="3.5" result="blur" />
                        <feMerge>
                            <feMergeNode in="blur" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                </defs>
                
                <!-- A continuous hand-drawn path representing "hello" signature -->
                <path class="handwritten-path" d="
                    M 50,115 
                    C 50,115 52,65 72,50 
                    C 92,35 98,60 92,100 
                    C 88,125 76,145 76,145 
                    C 76,145 105,95 120,95 
                    C 135,95 128,145 128,145 
                    C 128,145 142,108 152,112 
                    C 162,116 150,145 144,145 
                    C 138,145 135,130 150,125 
                    C 165,120 172,145 172,145 
                    C 172,145 188,55 192,55 
                    C 196,55 180,145 180,145 
                    C 180,145 196,55 200,55 
                    C 204,55 188,145 188,145 
                    C 188,145 208,105 218,105 
                    C 228,105 232,145 218,145 
                    C 204,145 208,105 218,105 
                    C 228,105 242,120 255,120
                " />
            </svg>
        </div>
    </div>

    <!-- MAIN WEBSITE CONTENT -->
    <main class="main-content">
        <h1>Welcome to your new desktop.</h1>
        <p>Experience a minimal, fluid, and highly responsive user interface inspired by the best of desktop engineering.</p>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const path = document.querySelector('.handwritten-path');
            const preloader = document.getElementById('preloader');
            
            if (path) {
                // 1. Retrieve the exact mathematical length of the path curves
                const pathLength = path.getTotalLength();
                
                // 2. Set stroke properties to match the exact length to hide it initially
                path.style.strokeDasharray = pathLength;
                path.style.strokeDashoffset = pathLength;
                
                // Force a browser reflow so the layout updates before starting the transition
                path.getBoundingClientRect();
                
                // 3. Apply smooth drawing transition using CSS custom transition
                path.style.transition = 'stroke-dashoffset 3.2s cubic-bezier(0.45, 0, 0.15, 1)';
                
                // Start drawing immediately
                requestAnimationFrame(() => {
                    path.style.strokeDashoffset = '0';
                });
            }

            // 4. Automatically trigger the elegant fade out once drawing finishes
            setTimeout(() => {
                if (preloader) {
                    preloader.classList.add('fade-out');
                    document.body.classList.remove('loading');
                    
                    // Remove loader from the DOM layout to optimize active memory
                    setTimeout(() => {
                        preloader.style.display = 'none';
                    }, 1000);
                }
            }, 3800); // 3.2s draw animation + 600ms aesthetic pause
        });
    </script>
</body>
</html>
